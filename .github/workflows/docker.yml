name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    name: Build and scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t msfs:ci .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: msfs:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
